[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "controller-worker"
dynamic = ["version"]
description = "Delegate work from one Claude Code instance to another over SSH, with the glue on a free model gateway."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ulliiiiiiiii" }]
keywords = ["ai-agents", "claude-code", "orchestration", "delegation", "llm", "ssh"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[project.scripts]
controller-worker = "controller_worker.cli:main"

[project.urls]
Homepage = "https://github.com/ulliiiiiiiii/controller-worker"
Issues = "https://github.com/ulliiiiiiiii/controller-worker/issues"

[tool.hatch.version]
path = "controller_worker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["controller_worker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["controller_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
